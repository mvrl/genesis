[project]
name = "genesis"
version = "0.1.0"
description = "Genesis: A Generative Engine for Hierarchical Satellite Image Synthesis — training, evaluation, and demos."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"

# Versions pinned to the reference environment (torch 2.8.0 + CUDA 12.8).
# Set up with:  uv sync    (creates .venv and installs everything)
dependencies = [
    # ── core numerics / imaging ──────────────────────────────────────────────
    "torch==2.8.0",
    "torchvision==0.23.0",
    "numpy==2.3.3",
    "pillow==11.3.0",
    "opencv-python>=4.11,<5",
    "scipy==1.16.3",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
    "pyarrow==21.0.0",
    "einops==0.8.1",
    "tqdm==4.67.1",
    "requests==2.32.5",
    # ── training / model ─────────────────────────────────────────────────────
    "pytorch-lightning==2.5.5",
    "wandb==0.22.1",
    # ── reference metrics (SR / OP / pyramid) ────────────────────────────────
    "torchmetrics==1.8.2",
    "lpips==0.1.4",
    "DISTS-pytorch==0.1",
    # ── Hugging Face stack (Git-10M + dense500 datasets; Qwen2.5-VL caption) ──
    "transformers>=4.57.1,<4.58",
    "datasets==4.4.0",
    "huggingface-hub==0.35.3",
    "accelerate==1.10.1",
    "safetensors==0.6.2",
    # ── demos (Gradio apps) ──────────────────────────────────────────────────
    "gradio==6.1.0",
    # ── data-prep split building + dense500 visualization ────────────────────
    "geopandas==1.1.3",
    "shapely==2.1.2",
    "rasterio==1.4.3",
    # ── dense500 semantic / caption eval metrics (not in the reference env) ───
    "open-clip-torch>=2.24",
    "sentence-transformers>=3.0",
    "qwen-vl-utils>=0.0.8",
]

# Flat-layout repo (scripts run via PYTHONPATH=src / from their own dirs); not an
# installable package — uv just manages the virtualenv + dependencies.
[tool.uv]
package = false

# torch/torchvision built against CUDA 12.8 (matches the reference env's
# torch 2.8.0+cu128). For CPU-only, drop this index or use the cpu wheel index.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
